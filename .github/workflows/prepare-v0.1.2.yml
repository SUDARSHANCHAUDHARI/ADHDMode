name: Prepare ADHDMode v0.1.2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/v0.1.2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Prepare versioned release files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const version = '0.1.2';
          const updateJson = (path, mutate) => {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            mutate(value);
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          };

          updateJson('package.json', value => { value.version = version; });
          updateJson('.claude-plugin/marketplace.json', value => {
            value.version = version;
            value.plugins[0].version = version;
          });
          updateJson('.claude-plugin/plugin.json', value => { value.version = version; });
          updateJson('.codex-plugin/plugin.json', value => { value.version = version; });
          updateJson('gemini-extension.json', value => { value.version = version; });

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme
            .replace('version-0.1.1-blue.svg', 'version-0.1.2-blue.svg')
            .replaceAll('/releases/tag/v0.1.1', '/releases/tag/v0.1.2')
            .replace('> **Public release:** ADHDMode `v0.1.1` is available', '> **Public release:** ADHDMode `v0.1.2` is available')
            .replace('- [v0.1.1 release notes](docs/release-notes-v0.1.1.md)', '- [v0.1.2 release notes](docs/release-notes-v0.1.2.md)\n- [v0.1.1 release notes](docs/release-notes-v0.1.1.md)')
            .replace('`v0.1.1` is the current maintenance release. It adds clean-install verification, contributor templates, five-minute onboarding, mode examples, and current Codex Mentions V2 guidance without changing the canonical ADHDMode response policy.', '`v0.1.2` is the current maintenance release. It makes quick mode concise and state-aware, corrects the published release checklist, and limits Codex activation guidance to observed evidence.')
            .replace('The repository is public, the release tag is published, and the documented remote installation paths are ready for use.', 'The repository is public and the documented remote installation paths are ready for use. Some authenticated cross-agent behavior checks remain incomplete and are tracked transparently in issue #12.');
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = `## 0.1.2\n\n- Made quick mode concise and state-aware for release-readiness and current-state tasks.\n- Prevented already-completed publication, deployment, or verification work from being recommended again.\n- Added a regression evaluation and deterministic contract for stale planning-state conflicts.\n- Corrected the published v0.1.1 checklist to match verified GitHub state.\n- Documented \`@adhd-mode\` as the verified Codex activation path and \`$adhd-mode\` as unverified legacy syntax.\n- Preserved explicit disclosure that remaining authenticated cross-agent behavior checks are incomplete.\n\n`;
          changelog = changelog.replace('# Changelog\n\n', `# Changelog\n\n${section}`);
          fs.writeFileSync('CHANGELOG.md', changelog);

          let checklist = fs.readFileSync('docs/release-checklist.md', 'utf8');
          checklist = checklist
            .replace('The current public release is [`v0.1.1`](https://github.com/SUDARSHANCHAUDHARI/ADHDMode/releases/tag/v0.1.1), published from commit `168c967419213a1e67009a1cafe3f6ad770548f7`.', 'The release being prepared is [`v0.1.2`](https://github.com/SUDARSHANCHAUDHARI/ADHDMode/releases/tag/v0.1.2). Its final published commit is recorded after the release is created.')
            .replace('- [x] Run `pnpm release:publish` to create the version tag and GitHub release.', '- [ ] Run `pnpm release:publish` to create the `v0.1.2` tag and GitHub release.');
          fs.writeFileSync('docs/release-checklist.md', checklist);

          fs.writeFileSync('docs/release-notes-v0.1.2.md', `# ADHDMode v0.1.2\n\nADHDMode v0.1.2 is a maintenance release focused on evidence-based state handling and accurate Codex guidance.\n\n## Improvements\n\n- Quick mode now returns only the requested fields and requested number of actions.\n- Verified current state outranks stale checklists or planning artifacts.\n- Completed publication, deployment, and verification actions are not proposed again.\n- Generic closing invitations remain prohibited in quick mode.\n- The release-readiness failure observed in authenticated Codex testing now has regression evaluation and contract coverage.\n\n## Documentation corrections\n\n- The public-release checklist now matches the verified v0.1.1 GitHub state.\n- Codex documentation uses \`/skills\` and \`@adhd-mode\` as the verified path.\n- \`$adhd-mode\` is documented as unverified legacy syntax because authenticated testing did not show observable \`SKILL.md\` loading.\n\n## Validation\n\nThe deterministic repository, installation, evaluation, unit, and package gates are run on Node.js 20 and Node.js 22 before merge.\n\n## Known verification status\n\nAuthenticated Codex discovery, primary \`@adhd-mode\` activation, and debug mode were observed on v0.1.1. The corrected quick-mode behavior and the remaining authenticated mode, safety, removal, reinstall, Cursor, and other-agent checks were not completed before this release. They remain tracked in issue #12.\n\nThis release does not claim that every supported agent has passed authenticated behavior testing.\n`);
          NODE

      - name: Remove one-time workflow
        run: rm .github/workflows/prepare-v0.1.2.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete tests
        run: pnpm test

      - name: Inspect package
        run: pnpm pack:check

      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json gemini-extension.json README.md CHANGELOG.md docs/release-checklist.md docs/release-notes-v0.1.2.md .github/workflows/prepare-v0.1.2.yml
          git commit -m "Prepare ADHDMode v0.1.2"
          git push origin HEAD:release/v0.1.2
